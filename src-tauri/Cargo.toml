[package]
name = "lumio"
version = "0.3.8"
description = "Lumio – a lightweight, open-source photo browser and digital asset manager"
authors = ["Light and Alley and Lumio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lumio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
rayon = "1"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.5"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
chrono = "0.4"
parking_lot = "0.12"
log = { version = "0.4", features = ["std"] }
# Copying photos to the clipboard for pasting into WhatsApp, email or a website.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# SmugMug upload: OAuth 1.0a signing and streaming files from disk.
hmac = "0.12"
sha1 = "0.10"
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSGeometry", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSharingService", "NSPasteboard", "NSView", "NSResponder", "NSWindow", "NSGraphics", "NSApplication"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Shell_Common",
    # Sharing: the Windows share sheet, email attachments (MAPI) and copying files.
    "ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage", "Storage_Streams",
    "Win32_System_WinRT", "Win32_System_Mapi", "Win32_System_LibraryLoader", "implement",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
shell-words = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
