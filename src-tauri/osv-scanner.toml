# OSV-Scanner reads this next to Cargo.lock. Each entry is an advisory with no fix Frameloft
# can take: they all come from Tauri's own Linux stack (GTK 0.18 bindings and zbus), are
# notices that a crate is unmaintained (not a vulnerability), or affect code Frameloft
# doesn't call. Every entry expires, so it is looked at again; remove it once Tauri
# updates the dependency. cargo audit lists the same notices in the Check log.

