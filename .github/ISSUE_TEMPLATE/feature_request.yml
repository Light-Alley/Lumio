name: Idea or feature request
description: Suggest something that would make Lumio better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the way you work, not only the solution. That helps us find the lightest way to fit it in.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: other
    attributes:
      label: How do other apps handle this? (optional)
