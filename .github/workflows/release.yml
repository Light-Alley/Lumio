# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.0.
# The installers are attached to a draft GitHub Release.
#
# Code signing is switched on by repository secrets and skipped when they are
# missing, so the workflow keeps working (unsigned) until they are added.
# What each secret is and how to get it: docs/code-signing.md, and for in-app
# updates docs/updates.md.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Bundle ExifTool
        run: node scripts/fetch-exiftool.mjs

      # Turns signing on only for the secrets that are actually set. Tauri treats an
      # empty variable as "set", so they can't simply be passed through as env.
      - name: Code signing setup
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMIO_UPDATER_PUBKEY: ${{ vars.LUMIO_UPDATER_PUBKEY }}
        run: |
          put() { # name value -> $GITHUB_ENV (multi-line safe)
            local d="EOF_$RANDOM$RANDOM"
            printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"
          }
          echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
          cfgs=()
          # In-app updates (Lumio > Check for Updates… > Install and Restart). This key is
          # Tauri's own update-signing key, not an Apple or Windows certificate. Without it
          # the app still tells people about new versions and links to the download page.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$LUMIO_UPDATER_PUBKEY" ]; then
            put TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            node -e '
              const repo = "https://github.com/" + process.env.GITHUB_REPOSITORY;
              require("fs").writeFileSync("src-tauri/tauri.updater.json", JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: {
                  pubkey: process.env.LUMIO_UPDATER_PUBKEY.trim(),
                  endpoints: [repo + "/releases/latest/download/latest.json"],
                  windows: { installMode: "passive" },
                } },
              }));'
            cfgs+=("src-tauri/tauri.updater.json")
            echo "In-app updates: on (update files are signed with the updater key)."
          else
            echo "::warning::In-app updates are off (TAURI_SIGNING_PRIVATE_KEY secret or LUMIO_UPDATER_PUBKEY variable not set). Lumio will still announce new versions. See docs/updates.md."
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
              put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
              put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
              [ -n "$APPLE_SIGNING_IDENTITY" ] && put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
              echo "macOS: signing with the Developer ID certificate."
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                put APPLE_ID "$APPLE_ID"
                put APPLE_PASSWORD "$APPLE_PASSWORD"
                put APPLE_TEAM_ID "$APPLE_TEAM_ID"
                echo "macOS: notarising with Apple."
              else
                echo "::warning::macOS build is signed but NOT notarised (APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID missing)."
              fi
            else
              echo "::warning::macOS build is not signed (APPLE_CERTIFICATE secrets not set). See docs/code-signing.md."
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] \
               && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ]; then
              put AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
              put AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
              put AZURE_TENANT_ID "$AZURE_TENANT_ID"
              cmd="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d Lumio %1"
              node -e 'require("fs").writeFileSync("src-tauri/tauri.signing.json", JSON.stringify({bundle:{windows:{signCommand:process.argv[1]}}}))' "$cmd"
              cfgs+=("src-tauri/tauri.signing.json")
              echo "WINDOWS_SIGN=1" >> "$GITHUB_ENV"
              echo "Windows: signing with Azure Artifact Signing."
            else
              echo "::warning::Windows build is not signed (AZURE_* secrets not set). See docs/code-signing.md."
            fi
          fi
          # Merge the extra settings into one --config file.
          if [ ${#cfgs[@]} -gt 0 ]; then
            node -e '
              const fs = require("fs");
              const merge = (a, b) => { for (const [k, v] of Object.entries(b)) a[k] = v && typeof v === "object" && !Array.isArray(v) ? merge(a[k] || {}, v) : v; return a; };
              const out = process.argv.slice(1).reduce((acc, f) => merge(acc, JSON.parse(fs.readFileSync(f, "utf8"))), {});
              fs.writeFileSync("src-tauri/tauri.ci.json", JSON.stringify(out));' "${cfgs[@]}"
            echo "SIGNING_ARGS=--config src-tauri/tauri.ci.json" >> "$GITHUB_ENV"
          fi

      - name: Install the Azure signing tool
        if: env.WINDOWS_SIGN == '1'
        run: cargo install trusted-signing-cli --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Lumio v__VERSION__
          releaseBody: See the assets below to download and install Lumio for your computer.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}
          # latest.json tells installed copies about the new version (only written when
          # the updater key is set, see above).
          includeUpdaterJson: true
