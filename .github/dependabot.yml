# Keeps dependencies (and the pinned GitHub Actions) up to date with weekly pull
# requests. New versions wait a few days first (cooldown), so a bad release is usually
# pulled before it reaches Frameloft; security updates don't wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # @types/node follows the Node version CI and the build use (22), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # SvelteKit and svelte-check support TypeScript 6 only; revisit when they take 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-major-days: 7

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 3
